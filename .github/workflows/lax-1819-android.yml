name: Build Lax-1819 Android APK

on:
  push:
    paths:
      - 'lax-1819/**'
      - '.github/workflows/lax-1819-android.yml'
  pull_request:
    paths:
      - 'lax-1819/**'
      - '.github/workflows/lax-1819-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Signed Lax-1819 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Generate ephemeral release keystore & build signed release APK/AAB
        id: gradle
        working-directory: lax-1819
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -v \
            -keystore my-release-key.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias lax1819 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Lax-1819, OU=Mobile, O=mohamadreza.lak, C=IR" >/dev/null 2>&1

          printf 'storeFile=my-release-key.jks\nstorePassword=%s\nkeyAlias=lax1819\nkeyPassword=%s\n' "$PASS" "$PASS" > keystore.properties

          set +e
          gradle assembleRelease bundleRelease --no-daemon --stacktrace --console=plain > ../lax-1819-gradle.log 2>&1
          status=$?
          set -e

          rm -f my-release-key.jks keystore.properties
          tail -n 150 ../lax-1819-gradle.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Clean up any signing files
        if: always()
        working-directory: lax-1819
        shell: bash
        run: rm -f my-release-key.jks keystore.properties

      - name: Upload Gradle log on failure
        if: steps.gradle.outputs.status != '0'
        uses: actions/upload-artifact@v7
        with:
          name: lax-1819-build-log
          path: lax-1819-gradle.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Surface Gradle errors as annotations
        if: steps.gradle.outputs.status != '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('lax-1819-gradle.log')
          messages = []
          if log.exists():
              text = log.read_text(errors='replace').splitlines()
              for line in text:
                  if re.search(r'^e: |error:|FAILED$|What went wrong|Execution failed|Caused by:|Could not ', line):
                      messages.append(line.strip())
          seen = set()
          for message in messages[:25]:
              message = ' '.join(message.split())[:1200]
              if message and message not in seen:
                  seen.add(message)
                  print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          if not seen:
              print('::error::Gradle failed; see the lax-1819-build-log artifact for the full output.')
          PY
          exit 1

      - name: Verify signed release APK and AAB
        if: steps.gradle.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          APK="lax-1819/app/build/outputs/apk/release/app-release.apk"
          AAB="lax-1819/app/build/outputs/bundle/release/app-release.aab"
          ls -lh "$APK" "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -n 30

      - name: Upload signed Lax-1819 Release APK
        if: steps.gradle.outputs.status == '0'
        uses: actions/upload-artifact@v7
        with:
          name: Lax-1819-release-apk
          path: lax-1819/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
