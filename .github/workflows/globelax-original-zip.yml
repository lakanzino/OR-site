name: Build original Globe.Lax ZIP for Android
on:
  push:
    branches: ['arena/4e2ce6a8-or-site']
    paths: ['.github/workflows/globelax-original-zip.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Build the original ZIP without modifying its source
        run: |
          set -euxo pipefail
          mkdir -p /tmp/original-globelax
          unzip -q 'develop-globelax-android-app (1).zip' -d /tmp/original-globelax
          cd /tmp/original-globelax
          npm ci
          npm run build
          # Preserve the copyright and MIT grant in the packaged assets.
          cp LICENSE dist/LICENSE.txt
          npm install --no-save --ignore-scripts @capacitor/core@7.6.10 @capacitor/cli@7.6.10 @capacitor/android@7.6.10
          npx cap init 'Globe.Lax' com.globelax.original --web-dir dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Globe.Lax-original-test.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/Globe.Lax-original-test.apk"
          sha256sum "$GITHUB_WORKSPACE/Globe.Lax-original-test.apk"
      - name: Stage APK for transfer to Drive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import base64, json, os, pathlib, subprocess
          data = pathlib.Path('Globe.Lax-original-test.apk').read_bytes()
          payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
          sha = subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs", '-X', 'POST', '--input', '-', '--jq', '.sha'], input=payload, text=True).strip()
          print(f'::notice title=APK_BLOB::{sha}')
          PYCODE
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobeLax-original-test-apk
          path: Globe.Lax-original-test.apk
          retention-days: 7
      - name: Launch original app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r Globe.Lax-original-test.apk
            adb shell am start -n com.globelax.original/.MainActivity
            sleep 20
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml > window.xml
            cat window.xml
            grep -q 'Welcome to Globe.Lax' window.xml
