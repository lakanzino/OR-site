name: Build Element.Lax Unsigned Release APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'elementlax/**'
      - '.github/workflows/elementlax-android.yml'
  pull_request:
    paths:
      - 'elementlax/**'
      - '.github/workflows/elementlax-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-apk:
    name: Build & Align Unsigned Element.Lax Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: elementlax/package-lock.json

      - name: Build web bundle & sync Capacitor Android
        working-directory: elementlax
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          npx cap sync android
          chmod +x android/gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK with R8 shrinking
        id: gradle
        working-directory: elementlax/android
        continue-on-error: true
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload Gradle log on failure
        if: steps.gradle.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: elementlax-gradle-failure-log
          path: elementlax/android/gradle-build.log
          retention-days: 5

      - name: Surface Gradle errors as annotations
        if: steps.gradle.outputs.status != '0'
        working-directory: elementlax/android
        run: |
          python3 - <<'PY'
          import pathlib
          lines = pathlib.Path("gradle-build.log").read_text(errors="replace").splitlines()
          for idx, line in enumerate(lines):
              if any(k in line for k in ("FAILURE:", "Execution failed", "e: ", "error:", "Exception")):
                  snippet = " | ".join(lines[max(0, idx - 1):min(len(lines), idx + 6)])
                  print(f"::error title=GradleBuildError::{snippet[:900]}")
          print("::error title=GradleTail::" + " | ".join(lines[-40:])[:900])
          PY
          exit 1

      - name: Align & verify unsigned release APK
        if: steps.gradle.outputs.status == '0'
        env:
          BT_DIR: ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0
        run: |
          UNSIGNED_APK="elementlax/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="/tmp/app-release-unsigned-aligned.apk"
          test -f "$UNSIGNED_APK"
          "$BT_DIR/zipalign" -f -p -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BT_DIR/zipalign" -c -v -p 4 "$ALIGNED_APK" >/dev/null
          "$BT_DIR/aapt2" dump badging "$ALIGNED_APK" | tee /tmp/elementlax_badging.txt

      - name: Stage unsigned APK & apksigner tool blobs for private sandbox signing
        if: steps.gradle.outputs.status == '0' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_DIR: ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess

          def post_blob(path: pathlib.Path):
              data = path.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              payload = json.dumps({
                  "content": base64.b64encode(data).decode("ascii"),
                  "encoding": "base64",
              })
              repo = os.environ["GITHUB_REPOSITORY"]
              blob_sha = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/git/blobs", "-X", "POST", "--input", "-", "--jq", ".sha"],
                  input=payload,
                  text=True,
              ).strip()
              return blob_sha, sha256, len(data)

          apk_blob, apk_sha256, apk_size = post_blob(pathlib.Path("/tmp/app-release-unsigned-aligned.apk"))
          signer_blob, signer_sha256, signer_size = post_blob(
              pathlib.Path(os.environ["BT_DIR"]) / "lib" / "apksigner.jar"
          )
          badging = pathlib.Path("/tmp/elementlax_badging.txt").read_text().splitlines()
          meta = {
              "apk_blob_sha": apk_blob,
              "apk_sha256": apk_sha256,
              "apk_size": apk_size,
              "apksigner_blob_sha": signer_blob,
              "apksigner_sha256": signer_sha256,
              "apksigner_size": signer_size,
              "aapt2": badging[:35],
          }
          print("::notice title=ELEMENTLAX_UNSIGNED_META::" + json.dumps(meta))
          PY

      - name: Upload unsigned aligned release APK artifact
        if: steps.gradle.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ElementLax-unsigned-release-apk
          path: /tmp/app-release-unsigned-aligned.apk
          retention-days: 7
