name: Build unsigned Globe and Invent release packages
on:
  push:
    branches: ['arena/81295dac-or-site']
    paths: ['.github/workflows/lax-release-unsigned.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [globe, invent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Build release APK and bundle without a signing key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lax-src
          if [ "$APP" = globe ]; then
            cp -a globelax-original/. /tmp/lax-src/
            APP_ID=com.globelax.audited
            APP_NAME='Globe.Lax بررسی‌شده'
          else
            gh api repos/lakanzino/OR-site/git/blobs/9a14c975b2f121c77581a24121f0dfb1664889f9 --jq .content | base64 -d > /tmp/invent.zip
            test "$(git hash-object /tmp/invent.zip)" = 9a14c975b2f121c77581a24121f0dfb1664889f9
            unzip -q /tmp/invent.zip -d /tmp/lax-src
            APP_ID=com.inventlax.app
            APP_NAME='Invent.Lax'
          fi
          cd /tmp/lax-src
          npm ci
          npx tsc --noEmit
          npm run build
          cp LICENSE dist/LICENSE.txt
          if [ "$APP" = globe ]; then
            python3 tools/verify-audit.py
            cp audit/README.fa.md dist/THIRD-PARTY-NOTICES.txt
          fi
          npm install --no-save --ignore-scripts @capacitor/core@7.6.10 @capacitor/cli@7.6.10 @capacitor/android@7.6.10 @resvg/resvg-js@2.6.2
          npx cap init "$APP_NAME" "$APP_ID" --web-dir dist
          npx cap add android
          npx cap sync android
          if [ "$APP" = invent ]; then
            mkdir -p android/app/src/main/res/drawable-nodpi
            node --input-type=module -e "import {Resvg} from '@resvg/resvg-js'; import fs from 'node:fs'; fs.writeFileSync('android/app/src/main/res/drawable-nodpi/invent_icon.png', new Resvg(fs.readFileSync('public/app-logo.svg'),{fitTo:{mode:'width',value:512}}).render().asPng())"
            python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('@mipmap/ic_launcher_round', '@drawable/invent_icon').replace('@mipmap/ic_launcher', '@drawable/invent_icon'))
          PY
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/lax-aligned.apk
          "$BT/zipalign" -c -p 4 /tmp/lax-aligned.apk
          "$BT/aapt" dump badging /tmp/lax-aligned.apk | head -8
          "$BT/aapt" dump permissions /tmp/lax-aligned.apk
          cp app/build/outputs/bundle/release/app-release.aab /tmp/lax-unsigned.aab
          sha256sum /tmp/lax-aligned.apk /tmp/lax-unsigned.aab
      - name: Stage unsigned packages and public signing tools for local signing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ matrix.app }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zipfile
          def post(path):
              b = pathlib.Path(path).read_bytes()
              payload = json.dumps({'content':base64.b64encode(b).decode(),'encoding':'base64'})
              sha = subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'-X','POST','--input','-','--jq','.sha'],input=payload,text=True).strip()
              return {'git_sha':sha,'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)}
          # Extract only the JDK's public jarsigner implementation; no keys are sent to CI.
          jmod = pathlib.Path(os.environ['JAVA_HOME'])/'jmods/jdk.jartool.jmod'
          with zipfile.ZipFile(jmod) as src, zipfile.ZipFile('/tmp/jartool.jar','w',zipfile.ZIP_DEFLATED) as out:
              for item in src.infolist():
                  if item.filename.startswith('classes/') and item.filename.endswith('.class') and item.filename != 'classes/module-info.class':
                      out.writestr(item.filename[len('classes/'):],src.read(item))
          result={'app':os.environ['APP'],'apk':post('/tmp/lax-aligned.apk'),'aab':post('/tmp/lax-unsigned.aab'),'jartool':post('/tmp/jartool.jar')}
          print('::notice title=UNSIGNED_META::'+json.dumps(result))
          PY
