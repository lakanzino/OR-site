name: Build Android APK

# Builds the Hamyar-j Android app, which lives at the root of this repository
# (app/, settings.gradle.kts, build.gradle.kts, gradle.properties) and uploads
# the renamed output app/build/outputs/apk/debug/Hamyar-j.apk as an artifact.
#
# The Gradle wrapper JAR is intentionally not committed: CI installs Gradle
# itself with gradle/actions/setup-gradle.

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Hamyar-j APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Installs Gradle 8.9 (AGP 8.5.2 needs >= 8.7) so no wrapper JAR is needed.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        id: gradle
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > gradle-output.log 2>&1
          status=$?
          tail -n 150 gradle-output.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      # Makes compiler errors readable from the run's annotations.
      - name: Surface Gradle errors as annotations
        if: steps.gradle.outputs.status != '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('gradle-output.log')
          messages = []
          if log.exists():
              text = log.read_text(errors='replace').splitlines()
              for line in text:
                  if re.search(r'^e: |error:|FAILED$|What went wrong|Execution failed|Caused by:|Could not ', line):
                      messages.append(line.strip())
          seen = set()
          for message in messages[:20]:
              message = ' '.join(message.split())[:1200]
              if message and message not in seen:
                  seen.add(message)
                  print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          if not seen:
              print('::error::Gradle failed; see the android-build-log artifact for the full output.')
          PY
          exit 1

      - name: Verify APK output name
        if: steps.gradle.outputs.status == '0'
        shell: bash
        run: |
          ls -l app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/Hamyar-j.apk

      - name: Upload Hamyar-j APK
        if: steps.gradle.outputs.status == '0'
        uses: actions/upload-artifact@v7
        with:
          name: Hamyar-j-apk
          path: app/build/outputs/apk/debug/Hamyar-j.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle log
        if: steps.gradle.outputs.status != '0'
        uses: actions/upload-artifact@v7
        with:
          name: android-build-log
          path: gradle-output.log
          if-no-files-found: ignore
          retention-days: 14
