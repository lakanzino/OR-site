name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android-app/**'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # The project intentionally uses the Gradle version from wrapper.properties.
      # CI installs it explicitly because the uploaded archive did not contain a wrapper JAR.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Run unit tests, lint and assemble debug APK
        id: gradle
        working-directory: android-app
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace --console=plain > gradle-output.log 2>&1
          status=$?
          tail -n 160 gradle-output.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Surface Gradle errors as annotations
        if: steps.gradle.outputs.status != '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path('android-app')
          log = root / 'gradle-output.log'
          messages = []
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  if re.search(r'^e:|error:|FAILED$|What went wrong|Execution failed|Caused by:', line):
                      messages.append(line.strip())
          for xml in root.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              try:
                  tree = ET.parse(xml)
                  for case in tree.getroot().iter('testcase'):
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          messages.append(f"{case.get('classname')}.{case.get('name')}: {failure.get('message') or (failure.text or '')[:500]}")
              except ET.ParseError:
                  pass
          for xml in root.glob('app/build/reports/lint-results-*.xml'):
              try:
                  for issue in ET.parse(xml).getroot().iter('issue'):
                      if issue.get('severity') in ('Error', 'Fatal'):
                          loc = issue.find('location')
                          where = f"{loc.get('file')}:{loc.get('line')}" if loc is not None else ''
                          messages.append(f"lint {issue.get('id')} {where}: {issue.get('message')}")
              except ET.ParseError:
                  pass
          test_messages = [m for m in messages if m.startswith('ir.clinic.secretary.')]
          chosen = (test_messages or messages)[:8]
          seen = set()
          for message in chosen:
              message = ' '.join(message.split())[:1200]
              if message not in seen:
                  seen.add(message)
                  print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          if not seen:
              print('::error::Gradle failed; see the uploaded android-build-reports artifact.')
          PY
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-reports
          path: |
            android-app/app/build/reports/
            android-app/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
