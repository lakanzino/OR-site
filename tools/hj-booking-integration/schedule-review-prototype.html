<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازبینی آزمایشی نتیجه</title>
<style>*{box-sizing:border-box}body{font:16px sans-serif;max-width:38rem;margin:auto;padding:1rem}fieldset{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;min-width:0}label{display:grid;gap:.4rem;min-width:0}input,select,button{font:inherit;min-height:44px;max-width:100%;min-width:0}input,select{width:100%}[role=status]{min-height:3rem}</style></head>
<body><h1>بازبینی آزمایشی</h1><p>داده‌ها ساختگی‌اند و به سایت یا افزونه متصل نیستند. تنها صفحهٔ اول نمایش داده می‌شود.</p>
<form id="review"><fieldset id="fields" disabled><label>انتخاب یک سابقه <select id="candidate"><option value="">انتخاب کنید</option></select></label><label>شروعی که به یاد دارید <input id="start" type="time" value="15:00" required></label><label>پایان <input id="end" type="time" value="20:00" required></label><button id="compare" type="submit">بررسی ردیف انتخاب‌شده</button></fieldset></form>
<p id="message" role="status" aria-live="polite">در حال دریافت فهرست آزمایشی…</p>
<p>این صفحه فقط بررسی می‌کند؛ هیچ ذخیره، لغو یا تأیید نهایی انجام نمی‌دهد.</p>
<script src="/review.js"></script></body></html>
