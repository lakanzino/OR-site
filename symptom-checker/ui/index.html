<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>همیار نشانه‌ها — نمونهٔ نمایشی (منتشر نشده)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">پرش به محتوای اصلی</a>

  <header class="site-header">
    <div class="wrap">
      <p class="brand">همیار جراحی — نمونهٔ داخلی</p>
      <p class="notice" role="note">
        این صفحه <strong>نمایشی</strong> است، دادهٔ آن <strong>پیش‌نویس</strong> و منتشر نشده است.
        پاسخ‌ها ذخیره یا ارسال نمی‌شوند.
      </p>
    </div>
  </header>

  <main class="wrap">
    <div id="safety" hidden></div>
    <div id="app"></div>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </main>

  <footer class="site-footer wrap">
    <p>این ابزار تشخیص پزشکی نیست و جای معاینه، آزمایش یا مشاورهٔ پزشک را نمی‌گیرد.</p>
    <p>در درد شدید یا بدحالی، همین حالا کمک پزشکی بگیر.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
